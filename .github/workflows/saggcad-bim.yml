name: SAGGCAD BIM

# Hızlı denetim: BIM çekirdeği (saf Rust, bağımlılıksız) ve uygulamaya bağlantısı.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: saggcad_bim (cargo test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p saggcad_bim

  host:
    name: BIM komutları (uygulama içi testler)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (bim)
        env:
          LC_ALL: C
        run: cargo test --locked -p OpenCADStudio --lib bim
